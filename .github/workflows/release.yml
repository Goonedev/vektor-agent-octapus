# Builds the Windows installer and publishes it to GitHub Releases.
#
# Runs on every push to main: if no release exists yet for the version in package.json,
# it builds Vektor-Setup-<version>.exe and publishes release v<version>. Installed copies of
# Vektör pick the release up and update themselves. Pushing a v* tag works too.
name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Decide whether this version needs a release
        id: plan
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
          draft="$(gh release view "v$version" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null || echo missing)"
          if [ "$draft" = "false" ]; then
            echo "Release v$version is already published; bump the version in package.json to publish a new one."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "draft=$draft" >> "$GITHUB_OUTPUT"
          fi

      # GitHub only publishes a release that has a tag, so the release starts as a draft
      # pointing at this commit; the installer is uploaded to it and it is published last.
      - name: Create the draft release
        if: steps.plan.outputs.publish == 'true' && steps.plan.outputs.draft == 'missing'
        shell: bash
        run: >
          gh release create "v${{ steps.plan.outputs.version }}"
          --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA"
          --title "Vektör ${{ steps.plan.outputs.version }}" --generate-notes

      - uses: actions/setup-node@v4
        if: steps.plan.outputs.publish == 'true'
        with:
          node-version: 22
          cache: npm

      - if: steps.plan.outputs.publish == 'true'
        run: npm ci

      - if: steps.plan.outputs.publish == 'true'
        run: npm test

      - name: Build and publish the installer
        if: steps.plan.outputs.publish == 'true'
        run: npm run release:win

      - name: Publish the release
        if: steps.plan.outputs.publish == 'true'
        shell: bash
        run: gh release edit "v${{ steps.plan.outputs.version }}" --repo "$GITHUB_REPOSITORY" --draft=false --latest
